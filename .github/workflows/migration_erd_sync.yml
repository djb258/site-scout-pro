name: Migration-ERD Sync
on: [pull_request]
jobs:
  sync_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node ops/erd/migration_erd_sync.mjs
