# Process Registry
# CTB + Altitude Process Definitions
# Authority: imo-creator doctrine v1.4.0
# Hub: barton-storage

# --- Doctrine References ---
doctrine:
  canonical: "doctrine/REPO_DOMAIN_SPEC.md"
  hub_prd: "docs/prd/PRD_BARTON_STORAGE_HUB.md"
  erd_discipline: "docs/erd/ERD_DISCIPLINE.md"

# --- Process Definitions ---

site_scoring_pipeline:
  altitude_layer: "20k"
  pass_type: "COMPUTE"
  doctrine_reference: "doctrine/REPO_DOMAIN_SPEC.md"
  prd_reference: "docs/prd/PRD_PASS1_STRUCTURE_HUB.md"
  erd_reference: "docs/erd/ERD_SubHub1_Market.md"
  api_endpoint: "/api/score"
  neon_table: "site_candidate"
  process_logging: true
  constants_consumed:
    - "demographics_data"
    - "market_signals"
    - "census_tract_data"
  variables_produced:
    - "site_score"
    - "viability_flag"
  steps:
    - name: "saturation_calculation"
      type: "processor"
      processor: "backend.core.saturation.calculate_saturation"
    - name: "parcel_viability"
      type: "processor"
      processor: "backend.core.calculations.calculate_parcel_viability"
    - name: "county_difficulty"
      type: "processor"
      processor: "backend.core.calculations.calculate_county_difficulty"
    - name: "financial_score"
      type: "processor"
      processor: "backend.core.calculations.calculate_financial_score"
    - name: "final_score"
      type: "processor"
      processor: "backend.core.calculations.calculate_final_score"

saturation_pipeline:
  altitude_layer: "20k"
  pass_type: "COMPUTE"
  doctrine_reference: "doctrine/REPO_DOMAIN_SPEC.md"
  prd_reference: "docs/prd/PRD_PASS1_STRUCTURE_HUB.md"
  erd_reference: "docs/erd/ERD_SubHub1_Market.md"
  api_endpoint: "/api/saturation"
  neon_table: "saturation_matrix"
  process_logging: true
  constants_consumed:
    - "population_data"
    - "existing_supply_sqft"
  variables_produced:
    - "saturation_ratio"
    - "supply_gap"
  steps:
    - name: "calculate_saturation"
      type: "processor"
      processor: "backend.core.saturation.calculate_saturation"

parcel_screening_pipeline:
  altitude_layer: "20k"
  pass_type: "COMPUTE"
  doctrine_reference: "doctrine/REPO_DOMAIN_SPEC.md"
  prd_reference: "docs/prd/PRD_PASS2_UNDERWRITING_HUB.md"
  erd_reference: "docs/erd/ERD_SubHub4_Parcel.md"
  api_endpoint: "/api/parcels"
  neon_table: "parcel_screening"
  process_logging: true
  constants_consumed:
    - "parcel_geometry"
    - "zoning_code"
    - "flood_zone_data"
  variables_produced:
    - "parcel_viability_score"
    - "screening_verdict"
  steps:
    - name: "screen_parcel"
      type: "processor"
      processor: "backend.core.parcel_screening.screen_parcel"

county_scoring_pipeline:
  altitude_layer: "30k"
  pass_type: "COMPUTE"
  doctrine_reference: "doctrine/REPO_DOMAIN_SPEC.md"
  prd_reference: "docs/prd/PRD_PASS2_UNDERWRITING_HUB.md"
  erd_reference: "docs/erd/ERD_SubHub2_CountyCard.md"
  api_endpoint: "/api/county"
  neon_table: "county_score"
  process_logging: true
  constants_consumed:
    - "county_permit_rules"
    - "jurisdiction_data"
  variables_produced:
    - "county_difficulty_score"
    - "permit_timeline_estimate"
  steps:
    - name: "county_difficulty"
      type: "processor"
      processor: "backend.core.calculations.calculate_county_difficulty"

final_elimination_pipeline:
  altitude_layer: "20k"
  pass_type: "GOVERN"
  doctrine_reference: "doctrine/REPO_DOMAIN_SPEC.md"
  prd_reference: "docs/prd/PRD_BARTON_STORAGE_HUB.md"
  erd_reference: "docs/erd/ERD_SubHub5_DealGate.md"
  api_endpoint: "/api/elimination"
  neon_table: "site_candidate"
  process_logging: true
  constants_consumed:
    - "all_computed_scores"
  variables_produced:
    - "go_nogo_verdict"
    - "elimination_reason"
  steps:
    - name: "validate_final_score"
      type: "validator"
      rules:
        final_score:
          type: int
          required: true
          min: 0
          max: 100
    - name: "apply_elimination_rules"
      type: "processor"
      processor: "backend.core.rules.should_eliminate_by_final_score"

