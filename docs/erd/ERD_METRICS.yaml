# ---------------------------------------------------------------------------------
# SYNC QUERIES (Reference)
# ---------------------------------------------------------------------------------
queries:
  total_records: |
    SELECT COUNT(*) FROM {table_name};

  created_last_24h: |
    SELECT COUNT(*) FROM {table_name}
    WHERE created_at > NOW() - INTERVAL '24 hours';

  updated_last_24h: |
    SELECT COUNT(*) FROM {table_name}
    WHERE updated_at > NOW() - INTERVAL '24 hours';

  aggregate_all_tables: |
    SELECT
      SUM(reltuples::bigint) AS total_records
    FROM pg_class
    WHERE relnamespace = (SELECT oid FROM pg_namespace WHERE nspname = 'public')
      AND relkind = 'r';

  zip_survival_rate: |
    SELECT
      (SELECT COUNT(*) FROM layer_1_geography WHERE passed = true)::float /
      (SELECT COUNT(*) FROM zips_master)::float * 100 AS survival_rate;

